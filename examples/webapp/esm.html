<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-orz-demo-nonce' 'strict-dynamic'; style-src 'self' 'nonce-orz-demo-nonce' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net; base-uri 'none'">
<title>orz-mdhtml — ESM embedding example</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="app-bar"><strong>ESM example</strong><span class="app-muted">import { mountEditor } from 'orz-mdhtml-browser'</span></header>
<main class="app-grid" style="grid-template-columns: 1fr">
  <section class="pane"><div id="editor" class="editor"></div></section>
</main>
<script type="module" nonce="orz-demo-nonce">
  // An app that bundles the component resolves 'orz-mdhtml-browser' to esm/orz-mdhtml.browser.mjs
  // (package.json "exports" → "import"); this static page imports the file directly.
  import { mountEditor, assemble, extract, version } from '../../browser/esm/orz-mdhtml.browser.mjs';
  const saved = [];
  const editor = mountEditor(document.getElementById('editor'), {
    text: '# ESM\n\nmounted from the ES module build\n',
    nonce: 'orz-demo-nonce',
    hooks: { async save(text) { saved.push(text); } },
  });
  globalThis.demo = { editor, saved, assemble, extract, version, global: globalThis.OrzCarrier };
</script>
</body>
</html>
