<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The CSP recipe of FC-19 §8.4 with a nonce. A real app sends this as an HTTP
  header with a fresh nonce per response; a static example has to fix one.
  - script-src: the nonce (the bundle, this page's script; the component stamps
    it on CodeMirror's script and on every script of the preview frame, which
    inherits this policy) and 'strict-dynamic'.
  - style-src: this page, the nonce (CodeMirror's <style>, the preview's), the
    theme / KaTeX / highlight.js / Google Fonts hosts; style-src-attr for the
    style attributes KaTeX and the diagram libraries write.
  - connect-src: jsDelivr (inline assembly fetches the engine when the page
    loaded it by URL; this page loads it from 'self'), and blob: — this page's
    resolveAsset gives the object URLs of its uploads, and the editor reads a
    blob: URL's bytes once to hand the sandboxed preview the Blob (the preview
    cannot load the page's object URLs). img-src has blob: for the same URLs.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-orz-demo-nonce' 'strict-dynamic'; style-src 'self' 'nonce-orz-demo-nonce' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' blob: https://cdn.jsdelivr.net; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>orz-mdhtml — embedding example</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="app-bar">
  <strong>Notes app</strong>
  <span class="app-muted">two orz-mdhtml editors, one page (FC-19 app host)</span>
  <span class="app-spacer"></span>
  <span id="version" class="app-muted"></span>
</header>
<main class="app-grid">
  <section class="pane">
    <h2>Lecture notes <small>chrome: full · every hook</small></h2>
    <div id="editor-a" class="editor"></div>
  </section>
  <section class="pane">
    <h2>Scratch <small>chrome: none · the app drives the API</small></h2>
    <div class="app-tools">
      <button type="button" id="b-save">Save</button>
      <button type="button" id="b-undo">Undo</button>
      <button type="button" id="b-mode">Mode</button>
      <button type="button" id="b-ai">AI: shout selection</button>
      <button type="button" id="b-download">Download .md.html</button>
    </div>
    <div id="editor-b" class="editor"></div>
  </section>
  <aside class="pane side">
    <h2>Library <small>readDocument · renderPreview</small></h2>
    <ul id="library"></ul>
    <iframe id="thumb" title="Read-only preview" sandbox=""></iframe>
    <h3>Hook calls</h3>
    <ol id="log" class="log"></ol>
  </aside>
</main>
<script nonce="orz-demo-nonce" src="../../browser/orz-mdhtml.browser.js"></script>
<script nonce="orz-demo-nonce" src="app.js"></script>
</body>
</html>
